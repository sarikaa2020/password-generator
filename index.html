<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Password Generator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Password Generator 🔐</h1>
    
    <div class="output-box">
      <input type="text" id="password" readonly>
      <button onclick="copyPassword()">📋</button>
    </div>
    
    <div class="options">
      <label>Password Length:
        <input type="number" id="length" value="12" min="4" max="32">
      </label>
      <label><input type="checkbox" id="uppercase" checked> Uppercase</label>
      <label><input type="checkbox" id="lowercase" checked> Lowercase</label>
      <label><input type="checkbox" id="numbers" checked> Numbers</label>
      <label><input type="checkbox" id="symbols" checked> Symbols</label>
    </div>

    <!-- First main button -->
    <button id="generateBtn" onclick="generatePassword()">Generate Password</button>

    <!-- New feature: Regenerate button -->
    <button id="regenBtn" onclick="generatePassword()">🔄 Regenerate Password</button>

  </div>

  <script src="script.js"></script>
</body>
</html>
